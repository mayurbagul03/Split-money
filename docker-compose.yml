services:
  db:
    image: postgres:18-alpine
    container_name: splitmoney-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitmoney
      POSTGRES_PASSWORD: splitmoney_dev
      POSTGRES_DB: splitmoney
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitmoney -d splitmoney"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
